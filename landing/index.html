    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      O HTML de cada rota é gerado no build. Sem JavaScript, as animações de entrada não rodam,
      então as posições e opacidades iniciais escritas pelo Framer Motion são neutralizadas aqui.
    -->
    <noscript>
      <style>
        #root [style*="opacity:0"],
        #root [style*="opacity: 0"] {
          opacity: 1 !important;
          transform: none !important;
        }
        #root [style*="clip-path"] {
          clip-path: none !important;
        }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
